name: Build Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-release:
    runs-on: ubuntu-latest
    env:
      PACKAGE_NAME: dev.hisokakaori.hkopti
      PACKAGE_PATH: Packages/dev.hisokakaori.hkopti
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Read package version
        id: package
        shell: bash
        run: |
          version=$(jq -r '.version' "$PACKAGE_PATH/package.json")
          test -n "$version" && test "$version" != "null"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Validate release files
        shell: pwsh
        run: ./tools/build/package-check.ps1 -Release
      - name: Refuse an existing release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "${{ steps.package.outputs.version }}" >/dev/null 2>&1; then
            echo "Release ${{ steps.package.outputs.version }} already exists. Increment package.json version."
            exit 1
          fi
      - name: Create VPM zip
        working-directory: ${{ env.PACKAGE_PATH }}
        shell: bash
        run: zip -r "${{ github.workspace }}/${PACKAGE_NAME}-${{ steps.package.outputs.version }}.zip" .
      - name: Collect Unity package files
        shell: bash
        run: find "$PACKAGE_PATH" -name '*.meta' -print > metaList
      - name: Create unitypackage
        uses: pCYSl5EDgo/create-unitypackage@v1.2.3
        with:
          package-path: ${{ env.PACKAGE_NAME }}-${{ steps.package.outputs.version }}.unitypackage
          include-files: metaList
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "${{ steps.package.outputs.version }}" \
            "${PACKAGE_NAME}-${{ steps.package.outputs.version }}.zip" \
            "${PACKAGE_NAME}-${{ steps.package.outputs.version }}.unitypackage" \
            "$PACKAGE_PATH/package.json" \
            --title "ItiOptimiser ${{ steps.package.outputs.version }}" \
            --generate-notes
